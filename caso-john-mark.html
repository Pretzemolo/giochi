<title>Il Caso John e Mark</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Lilita+One&family=Nunito:wght@400;700;800&family=Special+Elite&family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&display=swap">
<style>
/* Layout: schermata unica da "fascicolo" — HUD in alto, palcoscenico illustrato 16:10, cassetto degli indizi sotto; overlay per jumpscare, biglietti, quiz e ritmo. Tema scuro unico, scelto di proposito. */
:root{
  --night:#0e1519; --panel:#16212a; --line:#2b3a44; --paper:#e4d9bf; --ink:#2a2118;
  --lamp:#f2c45a; --rust:#c2503a; --mist:#93a5ad; --fg:#ebe5d6; --ok:#7fb48a;
  --f-display:"Creepster","Impact",fantasy;
  --f-ui:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Nunito",system-ui,sans-serif;
  --f-note:"Special Elite","Courier New",monospace;
  --f-sym:"Noto Sans Symbols 2","Noto Sans Symbols","Segoe UI Symbol","Apple Symbols",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--night);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;background-image:radial-gradient(ellipse at 50% -10%,#1d2a33 0,transparent 60%)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px;display:flex;flex-direction:column;gap:12px}

.hud{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 16px;flex-wrap:wrap}
.hud-l{min-width:0;flex:1 1 300px}
.room{font-family:var(--f-display);font-size:clamp(24px,4.4vw,36px);color:var(--lamp);letter-spacing:.03em;line-height:1;text-shadow:0 2px 0 #000}
.obj-text{font-family:var(--f-ui);font-size:16px;margin-top:6px}
.hud-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.counters{display:flex;gap:6px;flex-wrap:wrap}
.ctr{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-ui);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 6px;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctr b{font-weight:400;color:var(--lamp)}
.ic{display:block;flex:none}
.icon-btn{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:999px;width:36px;height:36px;font-size:16px;cursor:pointer}
.icon-btn:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

/* Scena */
.scene{position:relative;width:100%;aspect-ratio:16/10;max-width:100%;container-type:inline-size;overflow:hidden;border-radius:14px;border:2px solid #000;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.55);background:#0a0e11;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.scene.s-kitchen{touch-action:none}
.world{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(0,0,0,.6))}
.scene.flicker{animation:flk .16s steps(2) 10}
@keyframes flk{50%{filter:brightness(.15)}}

.hot{cursor:pointer;outline:none}
.hot .hit{fill:transparent;stroke:none}
.hot .spr{transition:filter .15s}
.hot:hover .spr,.hot:focus-visible .spr{filter:brightness(1.18) drop-shadow(0 0 7px rgba(242,196,90,.85))}
.hot .tag{font-family:var(--f-ui);fill:#f4ecd9;stroke:#0b0d10;paint-order:stroke;opacity:0;transition:opacity .15s;pointer-events:none}
.hot:hover .tag,.hot:focus-visible .tag{opacity:1}
.hot.done .spr{filter:brightness(.55) saturate(.35)}
.hot.hid .spr{filter:brightness(.62) saturate(.7)}
.hot.got{opacity:0;transition:opacity .35s;pointer-events:none}
.hot.glow .spr{animation:glowf 1.3s ease-in-out infinite}
@keyframes glowf{50%{filter:brightness(1.25) drop-shadow(0 0 14px #f2c45a) drop-shadow(0 0 4px #f2c45a)}}
.hot.sel .spr{filter:brightness(1.25) drop-shadow(0 0 12px #f2c45a) drop-shadow(0 0 3px #f2c45a)}
.piece{transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.zone .zr{fill:transparent;stroke:transparent;stroke-width:6;stroke-dasharray:18 12}
.zone:hover .zr,.zone:focus-visible .zr{stroke:rgba(242,196,90,.6)}
.zone.glow .zr{animation:zglow 1.2s ease-in-out infinite}
@keyframes zglow{0%,100%{stroke:rgba(242,196,90,.3);fill:rgba(242,196,90,0)}50%{stroke:#f2c45a;fill:rgba(242,196,90,.12)}}
.slot{fill:rgba(0,0,0,.25);stroke:rgba(228,217,191,.45);stroke-width:5;stroke-dasharray:14 10;cursor:pointer}
.slot:hover{stroke:var(--lamp)}

.pop{position:absolute;z-index:8;transform:translate(-50%,-50%);pointer-events:none;animation:pop 1.2s ease-out forwards}
.pop svg{width:max(40px,7cqw);height:auto}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{opacity:1;transform:translate(-50%,-90%) scale(1.25)}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}

/* Cucina */
.dark{position:absolute;inset:0;z-index:5;background:rgba(2,3,5,.975);cursor:not-allowed}
.dark.lit{pointer-events:none;background:radial-gradient(circle max(100px,18cqw) at var(--mx,50%) var(--my,50%),rgba(255,200,110,.12),rgba(255,180,90,.05) 45%,rgba(2,3,5,.965) 100%)}
.candle-btn{position:absolute;z-index:6;transform:translate(-50%,-100%);background:none;border:0;padding:0;cursor:pointer;width:max(26px,3.6cqw)}
.candle-btn svg{width:100%;height:auto;filter:drop-shadow(0 0 10px #f2c45a);animation:cfl .25s infinite alternate}
@keyframes cfl{to{filter:drop-shadow(0 0 16px #f2c45a)}}
.flame{position:absolute;z-index:6;left:var(--mx,50%);top:var(--my,50%);transform:translate(-50%,-85%);width:max(24px,3.4cqw);pointer-events:none;animation:flick .18s infinite alternate}
.flame svg{width:100%;height:auto}
@keyframes flick{to{transform:translate(-50%,-87%) rotate(3deg)}}

/* Finestre */
.win{cursor:pointer;outline:none}
.win .crack,.win .shards{opacity:0;transition:opacity .15s}
.win.c1 .k1,.win.c2 .k1,.win.c2 .k2{opacity:1}
.win.broken .glass,.win.broken .crack{opacity:0}
.win.broken .shards{opacity:1}
.win.ready .frame{animation:glowf 1.2s ease-in-out infinite}
.win:hover .frame,.win:focus-visible .frame{filter:brightness(1.3)}

/* Cassetto */
.tray{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.tray:empty{display:none}
.tray h3{font-family:var(--f-ui);font-weight:400;font-size:15px;color:var(--lamp);margin:0;letter-spacing:.04em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:#0f171d;border:1px solid var(--line);border-radius:10px;padding:5px 10px 5px 6px;font-weight:700}
.chip b{font-family:var(--f-ui);font-weight:400;color:var(--mist);font-variant-numeric:tabular-nums}
.chip.ok{border-color:#3d5a45}.chip.ok b{color:var(--ok)}
.cipher{font-family:var(--f-sym);font-size:clamp(18px,3.2vw,26px);letter-spacing:.1em;line-height:1.7;color:var(--paper);background:#0b1115;border:1px solid var(--line);border-radius:10px;padding:10px 14px;overflow-wrap:anywhere}
.cipher .w{display:inline-block;margin-right:.75em;white-space:nowrap}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.lg{background:var(--paper);color:var(--ink);border-radius:6px;padding:3px 6px;font-family:var(--f-note);display:flex;justify-content:center;gap:6px;align-items:center;font-size:17px}
.lg.unk{background:#1d2a32;color:#5e717a}
.sym{font-family:var(--f-sym);font-size:20px}
.decf{display:flex;flex-direction:column;gap:8px}
.decf label{font-weight:800}
textarea{font:inherit;font-family:var(--f-note);font-size:17px;background:#0b1115;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;width:100%;box-sizing:border-box}
textarea:focus{outline:2px solid var(--lamp);outline-offset:1px}
textarea:disabled{opacity:.5}
.checklist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.checklist li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0f171d;border:1px solid var(--line);border-radius:10px;padding:6px 11px 6px 7px;font-weight:700}
.checklist li span{display:flex;align-items:center;gap:7px}
.checklist li b{font-family:var(--f-ui);font-weight:400;color:var(--mist);font-variant-numeric:tabular-nums;text-align:right}
.checklist li.ok{border-color:#3d5a45}.checklist li.ok b{color:var(--ok)}
.hint{color:var(--mist);margin:0;font-size:14px}
.btn{font-family:var(--f-ui);font-size:17px;background:var(--lamp);color:#20160a;border:0;border-radius:10px;padding:10px 20px;cursor:pointer;box-shadow:0 4px 0 #8f6b20;letter-spacing:.02em}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8f6b20}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.btn.big{font-size:22px;padding:14px 28px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Modali */
.modal{position:fixed;inset:0;z-index:50;background:rgba(2,4,6,.84);display:grid;place-items:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:580px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-card h2{font-family:var(--f-display);color:var(--lamp);font-weight:400;font-size:clamp(30px,6.5vw,46px);margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.02em}
.modal-card p{margin:0}
.eyebrow{font-family:var(--f-ui);color:var(--rust);letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.warn{color:var(--mist);font-size:14px;border-left:3px solid var(--rust);padding-left:10px}
.modal-card.note{background:var(--paper);color:var(--ink);font-family:var(--f-note);transform:rotate(-1.3deg);border:0;max-width:380px;background-image:repeating-linear-gradient(transparent 0 27px,rgba(42,33,24,.12) 27px 28px)}
.modal-card.note h2{font-family:var(--f-note);color:var(--ink);font-size:22px}
.note-map{display:flex;flex-direction:column;gap:6px;font-size:26px}
.note-map .sym{font-size:30px}
.note-creep{color:#7a2a1c;font-size:15px}
.modal-card.note .btn{align-self:flex-start}
.polaroid{background:#efe7d4;padding:10px 10px 4px;border-radius:4px;transform:rotate(1deg);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.polaroid svg{display:block;width:100%;height:auto;filter:sepia(.7) contrast(1.05) brightness(1.2)}
.cap{font-family:var(--f-note);color:var(--ink);text-align:center;font-size:16px;margin:6px 0 0}
.qhead{font-family:var(--f-ui);color:var(--mist);letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.modal-card.quiz h2{font-family:var(--f-ui);color:var(--fg);font-size:clamp(22px,4.5vw,28px)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:440px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;font-weight:800;font-size:16px;background:#0f171d;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--lamp)}
.entity-say{font-family:var(--f-note);color:var(--rust)}
#rc{width:100%;height:140px;background:#0b1115;border:1px solid var(--line);border-radius:12px;display:block}
.rstat{font-family:var(--f-ui);color:var(--mist);font-variant-numeric:tabular-nums}
.final-beast{width:min(260px,70vw);align-self:center;transition:transform .8s cubic-bezier(.5,-.3,.7,1.4),opacity .8s}
.final-beast svg{width:100%;height:auto;display:block}
.final-beast.off{transform:translateY(-140%) rotate(-25deg);opacity:0}
.kids{display:flex;justify-content:center;gap:24px}
.kids div{display:flex;flex-direction:column;align-items:center;gap:4px;animation:bounce .8s ease-in-out infinite alternate}
.kids div:nth-child(2){animation-delay:.4s}
.kids svg{width:110px;height:auto}
.kids b{font-family:var(--f-ui);font-weight:400;font-size:20px;color:var(--lamp)}
@keyframes bounce{to{transform:translateY(-8px)}}
.quote{font-family:var(--f-note);font-size:17px}
.stats{display:flex;gap:10px}
.stats div{flex:1;background:#0f171d;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-family:var(--f-ui);font-weight:400;font-size:26px;color:var(--lamp);font-variant-numeric:tabular-nums}
.stats span{color:var(--mist);font-size:13px}

/* Jumpscare */
.scare{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;overflow:hidden}
.scare .beast{width:min(115vw,115vh);height:auto;transform:scale(.1)}
.scare.go .beast{animation:lunge 1.8s cubic-bezier(.2,1.5,.4,1) forwards}
.scare.go{animation:flash 1.8s steps(1) forwards}
.scare.short .beast,.scare.short{animation-duration:.9s}
@keyframes lunge{0%{transform:scale(.12) rotate(-10deg)}12%{transform:scale(1.25) rotate(3deg)}16%{transform:scale(1.15) translate(-2%,1%)}20%{transform:scale(1.22) translate(2%,-1%)}24%{transform:scale(1.17) translate(-1%,1%)}28%{transform:scale(1.2) translate(1%,0)}85%{transform:scale(1.24);opacity:1}100%{transform:scale(1.35);opacity:0}}
@keyframes flash{0%{background:#fff}5%{background:#6a0c07}10%{background:#000}15%{background:#3f0604}20%{background:#000}100%{background:#000}}
.scare-text{position:absolute;bottom:9%;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:clamp(30px,8vw,80px);color:#e8463a;text-shadow:0 0 20px #000,0 0 4px #000;letter-spacing:.05em;padding-inline:16px}
.fade{position:fixed;inset:0;z-index:90;background:#000;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .6s;text-align:center;padding:16px}
.fade.on{opacity:1;pointer-events:auto}
.fade .ft{font-family:var(--f-display);color:var(--lamp);font-size:clamp(40px,10vw,84px);line-height:1}
.fade .fs{font-family:var(--f-ui);color:var(--mist);font-size:18px;margin-top:10px;letter-spacing:.08em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:60;background:#0b1115;border:1px solid var(--lamp);color:var(--fg);font-family:var(--f-ui);font-size:16px;padding:10px 18px;border-radius:12px;max-width:calc(100vw - 40px);box-sizing:border-box;text-align:center;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  .scare.go .beast{animation:none;transform:scale(1.1)}
  .scare.go{animation:none;background:#2a0403}
  .hot.glow .spr,.zone.glow .zr,.win.ready .frame,.kids div,.flame,.candle-btn svg,.scene.flicker{animation:none}
  .piece{transition:none}
}
</style>

<div class="wrap">
  <header class="hud">
    <div class="hud-l">
      <div class="room" id="roomName">Il Caso John e Mark</div>
      <div class="obj-text" id="objective">Premi "Entra in casa" per iniziare.</div>
    </div>
    <div class="hud-r">
      <div class="counters" id="counters"></div>
      <button class="icon-btn" id="mute" aria-label="Attiva o disattiva l'audio">🔊</button>
    </div>
  </header>
  <div class="scene" id="scene"></div>
  <section class="tray" id="tray"></section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="fade" id="fade"></div>
<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<div class="scare" id="scare" hidden aria-hidden="true">
  <svg class="beast" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="eyeg"><stop offset="0" stop-color="#fffbe0"/><stop offset=".55" stop-color="#f2c45a"/><stop offset="1" stop-color="#b2452f"/></radialGradient>
      <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    </defs>
    <path fill="#050607" d="M100 6 L117 30 L140 12 L146 42 L173 32 L166 62 L194 70 L172 92 L196 116 L166 122 L177 153 L146 148 L140 184 L114 164 L100 196 L86 164 L60 184 L54 148 L23 153 L34 122 L4 116 L28 92 L6 70 L34 62 L27 32 L54 42 L60 12 L83 30 Z"/>
    <path fill="#0d1013" d="M100 40 Q150 44 156 96 Q150 150 100 160 Q50 150 44 96 Q50 44 100 40Z"/>
    <ellipse cx="70" cy="86" rx="24" ry="17" fill="#f2c45a" opacity=".55" filter="url(#blur3)"/>
    <ellipse cx="130" cy="86" rx="24" ry="17" fill="#f2c45a" opacity=".55" filter="url(#blur3)"/>
    <ellipse cx="70" cy="86" rx="18" ry="13" fill="url(#eyeg)"/>
    <ellipse cx="130" cy="86" rx="18" ry="13" fill="url(#eyeg)"/>
    <ellipse cx="73" cy="87" rx="3.5" ry="10" fill="#140000"/>
    <ellipse cx="127" cy="87" rx="3.5" ry="10" fill="#140000"/>
    <path d="M50 116 Q100 170 150 116 Q100 132 50 116Z" fill="#420707"/>

</div>

<script>
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const scene=$('#scene'), tray=$('#tray');
let BACK,MID,TOP;
const pick=a=>a[Math.random()*a.length|0];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const S={scares:0,t0:0};
const EMPTY=['solo polvere e ragnatele.','niente qui...','vuoto. Ma qualcosa si è mosso.','odore di muffa e silenzio.','hai sentito un passo? No, niente.','nulla. Solo un brivido sulla schiena.'];
let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

/* ================= SPRITE ================= */
const SP={};
function def(name,w,h,svg,o={}){ SP[name]={w,h,svg,anchor:o.anchor||'bottom',shadow:o.shadow!==false}; }
const C={anchor:'center',shadow:false};

/* Garage */
def('armadietto',170,310,`<rect x="-85" y="-310" width="170" height="300" rx="8" fill="#5f7784"/><rect x="-85" y="-310" width="85" height="300" rx="8" fill="#6f8996"/>
<rect x="-75" y="-298" width="8" height="276" fill="#fff" opacity=".14" stroke="none"/>
<path d="M-62 -280h38M-62 -266h38M-62 -252h38M24 -280h38M24 -266h38M24 -252h38" stroke-width="5"/>
<rect x="-16" y="-170" width="8" height="40" rx="3" fill="#cfd8db"/><rect x="8" y="-170" width="8" height="40" rx="3" fill="#cfd8db"/>
<rect x="-58" y="-120" width="36" height="26" rx="3" fill="#e4d9bf" stroke-width="3" transform="rotate(-6 -40 -107)"/>
<rect x="-75" y="-12" width="20" height="12" fill="#2b3134"/><rect x="55" y="-12" width="20" height="12" fill="#2b3134"/>`);
def('cesto',140,115,`<path d="M-56 -80 Q-40 -114 -10 -88 Q10 -120 34 -86 Q50 -106 58 -80Z" fill="#7d8f96"/>
<path d="M-62 -82 L62 -82 L50 0 L-50 0Z" fill="#a8783c"/><path d="M-58 -54H58M-54 -28H54" stroke="#5e401c" stroke-width="4"/>
<path d="M-38 -80 L-34 0 M-12 -80 L-11 0 M12 -80 L11 0 M38 -80 L34 0" stroke="#5e401c" stroke-width="3"/>
<rect x="-70" y="-92" width="140" height="16" rx="8" fill="#c79a5a"/>`);
def('scopa',130,330,`<path d="M-50 -326 L-38 -330 L22 -76 L10 -72Z" fill="#9a6a38"/>

/* ================= AUDIO ================= */
let AC=null,master=null,muted=false,drone=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=muted?0:1; master.connect(AC.destination);}catch(e){AC=null} }
  if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,{type='sine',v=.12,to=null,delay=0}={}){ const a=ac(); if(!a) return; const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(master); o.start(t); o.stop(t+d+.05); }
function noise(d,{v=.3,f=1200,to=null,q=1}={}){ const a=ac(); if(!a) return; const t=a.currentTime;
  const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate), ch=b.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
  const s=a.createBufferSource(); s.buffer=b; const fl=a.createBiquadFilter(); fl.type='bandpass'; fl.frequency.setValueAtTime(f,t); if(to) fl.frequency.exponentialRampToValueAtTime(to,t+d); fl.Q.value=q;
  const g=a.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); s.connect(fl).connect(g).connect(master); s.start(t); }
const sfx={
  pick(){tone(660,.12,{type:'triangle',v:.12,to:1320});tone(990,.16,{type:'triangle',v:.08,delay:.08})},
  empty(){tone(150,.2,{v:.16,to:80})},
  knock(){tone(95,.12,{v:.3,to:50});noise(.08,{v:.2,f:800})},
  scare(big=true){noise(big?1.3:.65,{v:.6,f:3200,to:500,q:.8});tone(250,big?1.2:.6,{type:'sawtooth',v:.22,to:50});tone(170,big?1:.5,{type:'square',v:.12,to:40})},
  beat(){tone(180,.12,{v:.32,to:60});noise(.05,{v:.15,f:4000})},
  miss(){tone(110,.15,{type:'square',v:.05})},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,{type:'triangle',v:.1,delay:i*.11}))},
  glass(){noise(.6,{v:.45,f:6000,to:2500,q:2});[2400,3100,2800].forEach((f,i)=>tone(f,.3,{type:'triangle',v:.05,delay:i*.05}))}
};
function startDrone(){ const a=ac(); if(!a||drone) return; drone=[55,55.6,82.4].map(f=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.022;o.connect(g).connect(master);o.start();return o}); }
$('#mute').onclick=()=>{ muted=!muted; if(master) master.gain.value=muted?0:1; $('#mute').textContent=muted?'🔇':'🔊'; };

const CIPHER={A:'☾',B:'✦',C:'✿',E:'◈',F:'♆',I:'☿',M:'⌘',N:'△',O:'☉',Q:'◐',R:'✠',S:'♄',T:'⊗',U:'⚘',V:'♅'};
const MSG='Bravo, sei arrivato fin qui, mai troverai in cucina.';
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]+/g,' ').trim();
const CREEP=['Non dovresti essere qui.','Ti stiamo guardando.','Più cerchi, più ci avviciniamo.','Hai sentito quel rumore?','Non voltarti.','Loro sanno il tuo nome.','Fuggi finché puoi.','Manca poco...','Sei ancora qui?','Ultimo biglietto. Ora scrivi.'];

  const upd=()=>{ counters([['biglietto',st.notes+'/10']]); renderTray(); };
  function renderTray(){
    const ready=st.notes===10, letters=Object.keys(CIPHER).filter(L=>st.known.has(L)).sort();
    tray.innerHTML=`<h3>Messaggio cifrato</h3><div class="cipher">${enc}</div>
    <h3>Simboli scoperti · ${st.notes}/10 biglietti</h3>
    <div class="legend">${letters.map(L=>`<div class="lg"><span class="sym">${CIPHER[L]}</span>= ${L}</div>`).join('')}${'<div class="lg unk"><span class="sym">?</span>= ?</div>'.repeat(15-letters.length)}</div>

    <textarea id="dec" rows="2" ${ready?'':'disabled'} placeholder="${ready?'Scrivi qui il messaggio...':'Trova tutti i 10 biglietti per sbloccare'}" autocomplete="off" spellcheck="false"></textarea>

      else { t.value=''; t.blur(); jumpscare(()=>{ toast('Sbagliato! Ricomincia a scrivere da capo.'); $('#dec').focus(); },{text:'SBAGLIATO'}); } };

  }}));

  [['cassettiera',160,800,'Cassettiera',1],['barattolo',1110,300,'Barattolo',0],['cestino_pane',230,552,'Cestino del pane',0]].forEach(([n,x,y,l,ph])=>put(n,{x,y,label:l,onClick:g=>{

    if(!ph){ sfx.empty(); return toast(`${l}: ${pick(EMPTY)}`); }
    st.photo=true; sfx.pick(); pop(x,y-120,'foto'); upd(); objective("Rimetti ogni oggetto al suo posto, com'era nella foto."); setTimeout(showPhoto,700);
  }}));
  sortMid();
  P.forEach(p=>{ p.pos='f'+p.f; p.rot=(Math.random()*50-25)|0; p.g=put(p.n,{x:0,y:0,label:p.l,cls:'piece',onClick:()=>clickPiece(p)}); p.g.removeAttribute('transform'); });
  const dark=document.createElement('div'); dark.className='dark'; scene.appendChild(dark);
  dark.onclick=()=>{ sfx.empty(); toast('È troppo buio. Cerca una luce...'); };
  const cb=document.createElement('button'); cb.className='candle-btn'; cb.type='button'; cb.setAttribute('aria-label','Candela'); cb.innerHTML=icon('candela',40); cb.style.left=(250/16)+'%'; cb.style.top=(392/10)+'%'; scene.appendChild(cb);
  cb.onclick=e=>{ e.stopPropagation(); st.candle=true; cb.remove(); sfx.pick(); dark.classList.add('lit');
    const fl=document.createElement('div'); fl.className='flame'; fl.innerHTML=icon('candela',40); scene.appendChild(fl);
    toast('Hai la candela! Muovila sullo schermo per fare luce.'); objective('Muovi la candela per vedere. Cerca indizi sulla sera del rapimento.'); upd(); };
  function render(){ P.forEach(p=>{ const inS=p.pos[0]==='s', [x,y]=inS?K_SLOTS[+p.pos.slice(1)]:K_FLOOR[+p.pos.slice(1)];
    p.g.style.transform=`translate(${x}px,${y}px) rotate(${inS?0:p.rot}deg)`; p.g.classList.toggle('sel',st.sel===p); }); }
  function clickPiece(p){
    if(st.solved) return;
    if(!st.photo) return toast("Tutto è a soqquadro. Prima trova una foto di com'era.");
    if(st.sel&&st.sel!==p&&p.pos[0]==='s') return place(st.sel,+p.pos.slice(1));
    st.sel=st.sel===p?null:p; render(); if(st.sel) toast(`${p.l}: ora tocca il cerchio dove metterlo.`);
  }
  function clickSlot(i){ if(st.solved) return; if(!st.photo) return toast("Prima trova una foto di com'era la cucina."); if(!st.sel) return toast('Prima tocca un oggetto da spostare.'); place(st.sel,i); }
  function place(p,i){ const o=P.find(q=>q.pos==='s'+i); if(o) o.pos=p.pos; p.pos='s'+i; st.sel=null; sfx.knock(); render(); check(); }
  function check(){
    if(P.filter(p=>p.pos[0]==='s').length<6) return;
    if(!P.every(p=>p.pos==='s'+p.c)) return toast('Qualcosa non torna... guarda meglio la foto.');
    st.solved=true; sfx.win(); toast("La cucina è tornata com'era quella sera..."); objective('Qualcosa ti respira sul collo...');
    setTimeout(()=>jumpscare(()=>quiz(()=>go(room4,'La cameretta','Stanza 4 di 4')),{text:'ORA RISPONDI'}),1700);
  }
  function showPhoto(){
    const c=modal(`<div class="polaroid"><svg viewBox="0 0 1600 1000" xmlns="${NS}">${BG.kitchen.bg}${draw('cassettiera',160,800)}${draw('cestino_pane',230,552)}${draw('barattolo',1110,300)}${K_P.map(p=>draw(p.n,K_SLOTS[p.c][0],K_SLOTS[p.c][1])).join('')}${draw('john',450,905,1.6)}${draw('mark',610,915,1.6)}</svg><p class="cap">John e Mark, l'ultima sera</p></div><button class="btn" id="phok">Ho capito</button>`);
    c.querySelector('#phok').onclick=closeModal;
  }
  render(); upd();
}

/* ================= RITMO ================= */
function rhythm(n,onWin){
  const cfg=n===1?{count:10,need:7,gap:650,travel:1700,name:'La radio',desc:'Dalla radio esce una canzone distorta.'}:{count:14,need:10,gap:480,travel:1250,name:'Il tamburo',desc:'Il tamburo batte da solo, sempre più veloce.'};
  let raf=0,keyH=null;
  const stop=()=>{ cancelAnimationFrame(raf); if(keyH) window.removeEventListener('keydown',keyH); keyH=null; };
  function run(){
    const c=modal(`<h2>${cfg.name}</h2><p>${cfg.desc} Premi <b>COLPISCI</b> (o la barra spaziatrice) quando la nota entra nel cerchio. Servono ${cfg.need} colpi su ${cfg.count}.</p><canvas id="rc"></canvas><div class="rstat" id="rstat"></div><div class="row"><button class="btn big" id="rhit">COLPISCI</button><button class="btn ghost" id="rquit">Esci</button></div>`);
    const cv=c.querySelector('#rc'),ctx=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);
    const r0=cv.getBoundingClientRect(); cv.width=r0.width*dpr; cv.height=r0.height*dpr;
    const mult=[1,1,.5,.5,1,1,1,.5,.5,1,.5,.5,1,1]; const notes=[]; let t=0;
    for(let i=0;i<cfg.count;i++){ notes.push({t,st:0}); t+=cfg.gap*mult[i%mult.length]; }
    const t0=performance.now()+cfg.travel+500; let hits=0,miss=0,done=false,flashT=-1e9;
    const stat=c.querySelector('#rstat'), su=()=>stat.textContent=`Colpi ${hits} · Mancati ${miss} · Ne servono ${cfg.need}`;
    function hit(){ if(done) return; const el=performance.now()-t0; let best=null,bd=1e9;
      notes.forEach(nn=>{ if(nn.st) return; const d=Math.abs(nn.t-el); if(d<bd){bd=d;best=nn} });
      if(best&&bd<=170){ best.st=1; hits++; sfx.beat(); flashT=performance.now(); } else sfx.miss(); su(); }
    function frame(now){
      const el=now-t0,W=cv.width,H=cv.height,zx=W*.14,cy=H/2,r=H*.24;
      ctx.clearRect(0,0,W,H); ctx.strokeStyle='#2b3a44'; ctx.lineWidth=2*dpr; ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(W,cy); ctx.stroke();
      const fl=Math.max(0,1-(now-flashT)/220);
      ctx.lineWidth=3*dpr; ctx.strokeStyle=`rgba(242,196,90,${.5+fl*.5})`; ctx.beginPath(); ctx.arc(zx,cy,r*1.2,0,Math.PI*2); ctx.stroke();
      if(fl>0){ ctx.fillStyle=`rgba(242,196,90,${fl*.35})`; ctx.fill(); }
      notes.forEach(nn=>{
        if(nn.st===0&&el-nn.t>170){ nn.st=2; miss++; sfx.miss(); su(); }
        if(nn.st) return; const x=zx+(nn.t-el)/cfg.travel*(W-zx); if(x>W+r) return;
        ctx.fillStyle='#e4d9bf'; ctx.beginPath(); ctx.arc(x,cy,r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#2a2118'; ctx.font=`${r*1.25}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('♪',x,cy+r*.05);
      });
      if(notes.every(nn=>nn.st)) return end();
      raf=requestAnimationFrame(frame);
    }
    function end(){ done=true; stop();
      if(hits>=cfg.need){ sfx.win(); c.innerHTML=`<h2>A tempo!</h2><p>${hits} colpi perfetti. La musica si spegne di colpo.</p><button class="btn" id="rok">Continua</button>`; c.querySelector('#rok').onclick=()=>{ closeModal(); onWin(); }; }
      else { c.innerHTML=`<h2>Fuori tempo</h2><p>Solo ${hits} colpi, ne servivano ${cfg.need}. Qualcosa ride nel buio.</p><div class="row"><button class="btn" id="rre">Riprova</button><button class="btn ghost" id="rx">Esci</button></div>`; c.querySelector('#rre').onclick=run; c.querySelector('#rx').onclick=closeModal; }
    }
    c.querySelector('#rhit').addEventListener('pointerdown',e=>{ e.preventDefault(); hit(); });
    c.querySelector('#rquit').onclick=()=>{ stop(); closeModal(); };
    keyH=e=>{ if(e.code==='Space'){ e.preventDefault(); hit(); } }; window.addEventListener('keydown',keyH);
    su(); raf=requestAnimationFrame(frame);
  }
  run();
}

/* ================= STANZA 4: CAMERETTA ================= */
const WIN=`<rect class="hit" x="0" y="0" width="60" height="70" fill="transparent"/><g class="frame"><rect x="2" y="2" width="56" height="66" rx="2" fill="#3a2a1e" stroke="#0b0d10" stroke-width="1.5"/></g>
<g class="glass"><rect x="6" y="6" width="22" height="28" fill="#20384a"/><rect x="32" y="6" width="22" height="28" fill="#1d3344"/><rect x="6" y="38" width="22" height="26" fill="#1a2f3f"/><rect x="32" y="38" width="22" height="26" fill="#1c3243"/><circle cx="44" cy="16" r="4" fill="#e9e2c8" opacity=".8"/><path d="M8 30 L20 8" stroke="#fff" stroke-width="1.6" opacity=".18"/></g>
<g class="crack k1" stroke="#d6e8ee" stroke-width=".9" fill="none"><path d="M17 20 L9 11 M17 20 L26 13 M17 20 L12 31 M17 20 L27 28"/></g>
<g class="crack k2" stroke="#d6e8ee" stroke-width=".9" fill="none"><path d="M43 50 L35 41 M43 50 L53 43 M43 50 L37 62 M43 50 L54 58 M28 30 L8 44"/></g>
<g class="shards"><rect x="6" y="6" width="48" height="58" fill="#05070a"/><path d="M6 6 L15 6 L6 19Z M54 6 L45 6 L54 17Z M6 64 L17 64 L6 53Z M54 64 L43 64 L54 51Z" fill="#2a4558" stroke="#d6e8ee" stroke-width=".6"/></g>
<path d="M30 4V66M4 36H56" stroke="#3a2a1e" stroke-width="3"/><rect x="-2" y="66" width="64" height="5" rx="1" fill="#4a3628" stroke="#0b0d10" stroke-width="1.2"/>`;
function room4(){
  setRoom('bedroom','Stanza 4 · La cameretta','Completa tutte le prove della lista.');
  const st={bears:0,faces:0,rhythm:new Set(),trash:0,held:0,wrench:false,ready:false,broken:0};
  const wins=[{x:220},{x:1060}].map(w=>{
    const g=document.createElementNS(NS,'g'); g.setAttribute('class','win'); g.setAttribute('tabindex','0'); g.setAttribute('role','button'); g.setAttribute('aria-label','Finestra');
    g.setAttribute('transform',`translate(${w.x} 90) scale(3.6)`); g.innerHTML=WIN; BACK.appendChild(g); w.g=g; w.hits=0;
    const fire=e=>{ e.stopPropagation();
      if(!st.ready){ sfx.knock(); return toast(st.wrench?'Finestra: non ancora, finisci prima tutte le prove.':'Finestra: è bloccata. Ti serve qualcosa di pesante.'); }
      if(w.hits>=3) return;
      w.hits++;
      if(w.hits<3){ sfx.knock(); g.classList.add('c'+w.hits); toast('CRACK! Ancora...'); }
      else { sfx.glass(); g.classList.remove('ready'); g.classList.add('broken'); st.broken++; upd(); if(st.broken===2) finale(); else toast("CRASH! Ora l'altra finestra."); }
    };
    g.addEventListener('click',fire); g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fire(e);} });
    return w; });
  const upd=()=>{
    counters([['orso',st.bears+'/10'],['faccina_felice',st.faces+'/10']]);
    const L=[['orso','Orsacchiotti',st.bears+'/10',st.bears===10],['faccina_felice','Faccine felici',st.faces+'/10',st.faces===10],['note_ico','Prove di ritmo',st.rhythm.size+'/2',st.rhythm.size===2],['cartaccia','Cartacce buttate',st.trash+'/6'+(st.held?` · ${st.held} in mano`:''),st.trash===6],['chiave_inglese','Chiave inglese',st.wrench?'trovata':'—',st.wrench],['finestra_ico','Finestre rotte',st.broken+'/2',st.broken===2]];
    tray.innerHTML=`<h3>Prove della cameretta</h3><ul class="checklist">${L.map(([n,a,b,ok])=>`<li class="${ok?'ok':''}"><span>${icon(n,24)}${a}</span><b>${b}</b></li>`).join('')}</ul><p class="hint">La radio e il tamburo sono i minigiochi di ritmo. Le cartacce vanno raccolte e poi buttate nella pattumiera.</p>`;
    if(!st.ready&&st.bears===10&&st.faces===10&&st.rhythm.size===2&&st.trash===6&&st.wrench){
      st.ready=true; wins.forEach(w=>w.g.classList.add('ready')); sfx.win();
      objective('Rompi le finestre con la chiave inglese per attirare il mostro!'); toast('Una voce sussurra: «Rompi le finestre... fammi entrare.»');
    }
  };
  [['letto',300,862,'Letto',0],['armadio',1480,622,'Armadio',0],['baule',960,902,'Baule',1],['scatola_giochi',1250,882,'Scatola dei giochi',0],['libreria',700,602,'Libreria',0]].forEach(([n,x,y,l,w])=>put(n,{x,y,label:l,onClick:g=>{
    if(!search(g,l)) return; if(!w){ sfx.empty(); return toast(`${l}: ${pick(EMPTY)}`); }
    st.wrench=true; sfx.pick(); pop(x,y-80,'chiave_inglese'); toast('Baule: una chiave inglese! Pesante abbastanza per rompere un vetro.'); upd();
  }}));
  const radio=put('radio',{x:110,y:640,label:'Radio',onClick:()=>{ if(st.rhythm.has(1)) return toast('La radio ora tace.'); rhythm(1,()=>{ st.rhythm.add(1); radio.classList.add('done'); upd(); }); }});
  const drum=put('tamburo',{x:560,y:962,label:'Tamburo',onClick:()=>{ if(st.rhythm.has(2)) return toast('Il tamburo non batte più.'); rhythm(2,()=>{ st.rhythm.add(2); drum.classList.add('done'); upd(); }); }});
  put('pattumiera',{x:1470,y:962,label:'Pattumiera',onClick:()=>{
    if(!st.held) return toast(st.trash===6?'Pattumiera: è piena.':'Pattumiera: raccogli prima le cartacce sparse.');
    st.trash+=st.held; st.held=0; sfx.knock(); toast(`Buttate! (${st.trash}/6)`); upd();
  }});
  [[420,652],[850,712],[1110,724],[190,962],[1150,982],[730,962]].forEach(([x,y],i)=>{ put('cartaccia',{x,y,label:'Cartaccia',onClick:g=>{ g.remove(); st.held++; sfx.pick(); toast(`Cartaccia raccolta (${st.held} in mano). Buttala nella pattumiera.`); upd(); }}).setAttribute('transform',`translate(${x} ${y}) rotate(${[-20,14,-8,30,-26,10][i]})`); });
  sortMid();
  [[1440,190],[250,712],[330,340],[1170,340],[790,330],[100,425],[1300,735],[960,758],[40,980],[1585,975]].forEach(([x,y])=>hid('orso',x,y,()=>{ st.bears++; upd(); if(st.bears<10) toast(`Orsacchiotto (${st.bears}/10)`); },'orsacchiotto'));
  [[630,528],[140,560],[1020,600],[1380,590],[420,985],[870,880],[1450,450],[560,250],[1010,292],[1330,960]].forEach(([x,y])=>hid('faccina_felice',x,y,()=>{ st.faces++; upd(); if(st.faces<10) toast(`Faccina felice (${st.faces}/10)`); },'faccina felice'));
  function finale(){
    objective('Qualcosa sta arrivando...'); scene.classList.add('flicker'); toast('Un ruggito scuote la casa!');
    setTimeout(()=>{ sfx.scare(true);
      const c=modal(`<div class="final-beast">${$('#scare svg').outerHTML}</div><h2>Il mostro è qui!</h2><p>Ha sentito i vetri rompersi ed è entrato nella cameretta. Ti fissa con quegli occhi gialli... ma qualcosa non torna. Sotto il collo si vede una cerniera.</p><button class="btn big" id="unmask">Tira la cerniera</button>`);
      c.querySelector('#unmask').onclick=()=>{ c.querySelector('.final-beast').classList.add('off'); c.querySelector('#unmask').disabled=true; sfx.win(); setTimeout(ending,1000); };
    },1700);
  }
  upd();
}

/* ================= FINALE ================= */
function ending(){
  const s=Math.round((Date.now()-S.t0)/1000), mm=String(s/60|0).padStart(2,'0'), ss=String(s%60).padStart(2,'0');
  objective('Caso risolto.'); counters([]);
  const c=modal(`<div class="kids"><div>${icon('john',110)}<b>John</b></div><div>${icon('mark',110)}<b>Mark</b></div></div>
  <h2>Erano John e Mark!</h2>
  <p>Il mostro era un costume. Le entità misteriose, gli orsacchiotti, le faccine, i biglietti in codice e la cucina a soqquadro: era tutto un gioco preparato da loro due, per vedere se qualcuno avrebbe avuto il coraggio di venirli a cercare.</p>
  <p class="quote">«Sei il primo che arriva fino in fondo!» ride John. «Ma le finestre le paghi tu» aggiunge Mark.</p>
  <div class="stats"><div><b>${mm}:${ss}</b><span>tempo</span></div><div><b>${S.scares}</b><span>jumpscare subiti</span></div></div>
  <div class="row"><button class="btn big" id="again">Gioca ancora</button></div>`);
  c.querySelector('#again').onclick=()=>{ S.t0=Date.now(); S.scares=0; go(room1,'Il garage','Stanza 1 di 4'); };
}

intro();
