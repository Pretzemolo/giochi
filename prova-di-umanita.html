<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Prova di Umanità</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: un unico widget di verifica centrato, intestazione blu da "pannello di controllo", progressione a 15 tacche in basso */
:root{
  --bg:#e9edf2; --panel:#ffffff; --ink:#15202c; --muted:#5a6878; --line:#cbd4de;
  --tile:#f3f6f9; --accent:#1d5cf5; --on-accent:#ffffff; --ok:#16834a; --bad:#c62f2a;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1319; --panel:#17202a; --ink:#e5eaf0; --muted:#93a1b1; --line:#2b3846;
  --tile:#202b37; --accent:#5b86ff; --on-accent:#081128; --ok:#3cbf76; --bad:#f0605a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1319; --panel:#17202a; --ink:#e5eaf0; --muted:#93a1b1; --line:#2b3846;
  --tile:#202b37; --accent:#5b86ff; --on-accent:#081128; --ok:#3cbf76; --bad:#f0605a; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);max-width:60ch}

.widget{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px rgb(0 0 0 / .06),0 14px 32px -18px rgb(10 30 80 / .35)}
.widget.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.bar{background:var(--accent);color:var(--on-accent);padding:16px 20px;border-radius:5px 5px 0 0;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.bar>div:first-child{min-width:0}
.eyebrow{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.bar h2{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;margin:4px 0 2px;text-wrap:balance}
.bar p{margin:0;font-size:15px;opacity:.95}
.diff{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.diff .pips{display:flex;gap:3px;align-items:flex-end}
.diff .pips i{width:6px;border-radius:1px;background:currentColor;opacity:.3}
.diff .pips i.on{opacity:1}
.diff span{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}

.stage{padding:20px;min-height:270px;display:flex;flex-direction:column;gap:14px}
.foot{border-top:1px solid var(--line);padding:12px 20px;display:flex;flex-direction:column;gap:10px}
.prog{display:flex;gap:3px}
.prog i{flex:1;height:6px;border-radius:1px;background:var(--line)}
.prog i.done{background:var(--ok)}
.prog i.cur{background:var(--accent)}
.stats{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:4px;padding:10px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1;min-width:0;font:inherit;font-family:var(--mono);font-size:18px;padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--tile);color:var(--ink)}
.hint{color:var(--muted);font-size:14px;margin:0}
.big{font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,36px);text-align:center;padding:20px 8px;background:var(--tile);border-radius:4px;text-wrap:balance}
canvas{display:block;width:100%;max-width:320px;height:auto;border-radius:4px;border:1px solid var(--line);margin-inline:auto}

.check{display:flex;align-items:center;gap:14px;padding:18px;background:var(--tile);border:1px solid var(--line);border-radius:4px;font-size:18px;text-align:left;margin-block:auto}
.check .box{width:28px;height:28px;border:2px solid var(--muted);border-radius:3px;flex-shrink:0;position:relative;background:var(--panel)}
.check.busy .box{border-radius:50%;border-color:var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite}
.check.done .box{animation:none;border-radius:3px;border-color:var(--ok);background:var(--ok)}
.check.done .box::after{content:"";position:absolute;left:8px;top:3px;width:7px;height:14px;border:solid var(--panel);border-width:0 3px 3px 0;transform:rotate(45deg)}
@keyframes spin{to{transform:rotate(360deg)}}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.tile{aspect-ratio:1;background:var(--tile);border:2px solid transparent;border-radius:4px;font-size:clamp(30px,10vw,46px);display:grid;place-items:center;position:relative;line-height:1}
.tile.num{font-family:var(--mono);font-weight:700;font-size:clamp(20px,6vw,26px);aspect-ratio:auto;padding-block:18px}
.tile.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--tile))}
.tile.sel::after{content:"✓";position:absolute;top:3px;left:5px;font-size:13px;font-family:var(--mono);font-weight:700;color:var(--accent)}
.tile.lit{background:var(--accent)}
.tile:disabled{cursor:default}

.puzzle{position:relative;height:120px;border-radius:4px;overflow:hidden;
  background:repeating-linear-gradient(135deg,var(--tile) 0 14px,color-mix(in srgb,var(--accent) 14%,var(--tile)) 14px 28px)}
.puzzle .gap,.puzzle .piece{position:absolute;top:36px;width:48px;height:48px;border-radius:4px}
.puzzle .gap{background:var(--panel);box-shadow:inset 0 0 0 2px var(--muted);opacity:.85}
.puzzle .piece{background:var(--accent);box-shadow:0 4px 10px rgb(0 0 0 / .25)}
input[type=range]{width:100%;accent-color:var(--accent)}

.arena{position:relative;height:250px;background:var(--tile);border-radius:4px;overflow:hidden;touch-action:none}
.dot{position:absolute;width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:var(--panel);font-family:var(--mono);font-weight:700;font-size:18px}
.dot.hit{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;text-align:right;color:var(--muted)}
.timer.low{color:var(--bad)}

.rot{width:170px;height:170px;margin-inline:auto;border-radius:50%;background:var(--tile);border:2px dashed var(--line);display:grid;place-items:center;font-size:96px;line-height:1}
.rot span{display:block;transition:transform .2s}

.stroop{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,58px);text-align:center;padding:16px;background:var(--tile);border-radius:4px;letter-spacing:.02em}
.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.colors button{padding:12px 6px;border:1px solid var(--line);background:var(--panel);border-radius:4px;font-family:var(--mono);font-weight:700;text-transform:uppercase;font-size:13px}

.track{position:relative;height:48px;background:var(--tile);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.track .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 40%,transparent);border-inline:2px solid var(--ok)}
.track .mark{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--ink)}
.hits{display:flex;gap:6px;justify-content:center}
.hits i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ok)}
.hits i.on{background:var(--ok)}

.flee{position:absolute;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:4px;white-space:nowrap;transition:left .18s ease-out,top .18s ease-out;font-size:15px}
.flee .box{width:22px;height:22px;border:2px solid var(--muted);border-radius:3px}
.flee.tired{transition-duration:.8s}
.alpha{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.12em;text-align:center;overflow-wrap:anywhere;margin:0}

.cert{display:flex;flex-direction:column;gap:14px;text-align:center;margin-block:auto}
.cert .seal{width:84px;height:84px;margin-inline:auto;border-radius:50%;border:3px double var(--ok);display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:var(--ok);font-size:12px;letter-spacing:.06em;transform:rotate(-12deg)}
.cert dl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.cert dl div{background:var(--tile);border-radius:4px;padding:10px}
.cert dt{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cert dd{margin:0;font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.cert .verdict{font-size:18px;margin:0;text-wrap:balance}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:4px;font-weight:700;transition:.25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<main class="wrap">
  <header>
    <h1>Prova di Umanità</h1>
    <p>Quindici verifiche anti-robot, ognuna più cattiva della precedente. Un errore genera una nuova prova dello stesso livello e finisce nel tuo fascicolo.</p>
  </header>
  <section class="widget" id="widget">
    <div class="bar">
      <div>
        <div class="eyebrow">Verifica <span id="n">1</span> di 15</div>
        <h2 id="title">Caricamento…</h2>
        <p id="prompt"></p>
      </div>
      <div class="diff" aria-label="Difficoltà">
        <div class="pips" id="pips"></div>
        <span id="difflabel"></span>
      </div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="foot">
      <div class="prog" id="prog"></div>
      <div class="stats"><span>Tempo <b id="time">00:00</b></span><span>Errori <b id="errs">0</b></span></div>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const stage = $('#stage'), widget = $('#widget');
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const gen = (n, chars) => Array.from({ length: n }, () => pick(chars)).join('');

let idx = 0, errors = 0, t0 = Date.now(), cleanup = null, finished = false, toastT;

// ---------- utilità ----------
function toast(msg, kind) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + (kind || '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 1600);
}
function pass() { toast('Verificato', 'ok'); idx++; idx >= C.length ? finish() : show(idx); }
function fail(msg) {
  errors++; $('#errs').textContent = errors;
  toast(msg || 'Verifica non riuscita. Nuova prova.', 'bad');
  widget.classList.remove('shake'); void widget.offsetWidth; widget.classList.add('shake');
  show(idx);
}
function softError(msg) {
  errors++; $('#errs').textContent = errors; toast(msg, 'bad');
  widget.classList.remove('shake'); void widget.offsetWidth; widget.classList.add('shake');
}
function answer(s, ph, check, mode) {
  const f = el('form', 'row');
  const inp = el('input'); inp.id = 'ans' + idx; inp.placeholder = ph; inp.autocomplete = 'off';
  inp.setAttribute('autocapitalize', 'off'); inp.spellcheck = false;
  if (mode === 'num') inp.inputMode = 'numeric';
  const b = el('button', 'btn', 'Verifica'); b.type = 'submit';
  f.append(inp, b);
  f.addEventListener('submit', e => { e.preventDefault(); if (!inp.value.trim()) return; check(inp.value) ? pass() : fail(); });
  s.append(f); setTimeout(() => inp.focus({ preventScroll: true }), 50);
}
function verifyBtn(s, fn, label) {
  const b = el('button', 'btn', label || 'Verifica'); b.onclick = fn; b.style.alignSelf = 'flex-start'; s.append(b); return b;
}
function makeCanvas(w, h) {
  const cv = el('canvas'), d = window.devicePixelRatio || 1;
  cv.width = w * d; cv.height = h * d; cv.getContext('2d').scale(d, d); cv._w = w; cv._h = h; return cv;
}
function drawText(cv, text, hard) {
  const ctx = cv.getContext('2d'), W = cv._w, H = cv._h;
  const ink = css('--ink'), muted = css('--muted'), acc = css('--accent');
  ctx.fillStyle = css('--tile'); ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = muted;
  for (let i = 0; i < (hard ? 420 : 110); i++) { ctx.globalAlpha = Math.random() * .6; ctx.fillRect(Math.random() * W, Math.random() * H, 1.5, 1.5); }
  ctx.globalAlpha = 1;
  const curve = (c, lw) => { ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(0, Math.random() * H);
    ctx.bezierCurveTo(W * .33, Math.random() * H, W * .66, Math.random() * H, W, Math.random() * H); ctx.stroke(); };
  for (let i = 0; i < (hard ? 5 : 2); i++) { ctx.globalAlpha = .5; curve(muted, 1); }
  ctx.globalAlpha = 1;
  const fonts = ['"Bricolage Grotesque"', '"JetBrains Mono"', 'Georgia', '"Atkinson Hyperlegible"'];
  const step = (W - 36) / text.length;
  [...text].forEach((ch, i) => {
    ctx.save();
    ctx.translate(18 + step * i + step / 2 + (hard ? (Math.random() - .5) * 6 : 0), H / 2 + (Math.random() - .5) * (hard ? 22 : 8));
    ctx.rotate((Math.random() - .5) * (hard ? 1.0 : .35));
    if (hard) ctx.transform(1, 0, (Math.random() - .5) * .6, 1, 0, 0);
    ctx.font = `800 ${hard ? 28 + rnd(14) : 34}px ${hard ? pick(fonts) : fonts[0]}, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = hard ? pick([ink, acc, ink]) : ink;
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  });
  if (hard) { curve(ink, 2.5); ctx.globalAlpha = .7; curve(acc, 2); ctx.globalAlpha = 1; }
}
function textCaptcha(s, code, hard, caseSens, transform) {
  const cv = makeCanvas(320, 96); drawText(cv, code, hard); s.append(cv);
  const r = el('button', 'btn ghost', 'Nuovo codice'); r.style.alignSelf = 'center'; r.style.fontSize = '14px';
  r.onclick = () => show(idx); s.append(r);
  const expected = transform ? transform(code) : code;
  answer(s, 'Scrivi qui', v => caseSens ? v.trim() === expected : v.trim().toUpperCase() === expected.toUpperCase());
}
function countdown(s, secs, onEnd) {
  const t = el('div', 'timer'); s.prepend(t);
  const end = Date.now() + secs * 1000;
  const tick = () => { const left = Math.max(0, end - Date.now()); t.textContent = (left / 1000).toFixed(1) + ' s';
    t.classList.toggle('low', left < 2500); if (!left) { clearInterval(iv); onEnd(); } };
  const iv = setInterval(tick, 100); tick(); return () => clearInterval(iv);
}

// ---------- le 15 prove ----------
const COLORS = [['rosso', '#d4261e'], ['blu', '#2a5bd7'], ['verde', '#1c9a48'], ['giallo', '#d29b00'], ['viola', '#8b3fd0']];
const NUMW = ['zero','uno','due','tre','quattro','cinque','sei','sette','otto','nove','dieci','undici','dodici','tredici','quattordici','quindici'];

const C = [
{ t: 'Il classico', p: 'Spunta la casella. Facile, no?', r(s) {
  const b = el('button', 'check', '<span class="box"></span><span>Non sono un robot</span>');
  b.onclick = () => { if (b.dataset.on) return; b.dataset.on = 1; b.classList.add('busy');
    setTimeout(() => { b.classList.remove('busy'); b.classList.add('done'); setTimeout(pass, 450); }, 900); };
  s.append(b);
}},
{ t: 'Leggi il codice', p: 'Scrivi i caratteri che vedi nell\'immagine.', r(s) {
  textCaptcha(s, gen(5, 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'), false, false);
}},
{ t: 'Semafori', p: 'Seleziona tutte le caselle con un semaforo.', r(s) {
  const k = 3 + rnd(2), others = shuffle(['🚗','🌳','🏠','🚲','🐕','🚌','🌻','⛽','🛵']).slice(0, 9 - k);
  const items = shuffle([...Array(k).fill('🚦'), ...others]);
  const g = el('div', 'grid');
  items.forEach(e => { const b = el('button', 'tile', e); b.setAttribute('aria-pressed', 'false');
    b.onclick = () => { b.classList.toggle('sel'); b.setAttribute('aria-pressed', b.classList.contains('sel')); }; g.append(b); });
  s.append(g);
  verifyBtn(s, () => { const ok = [...g.children].every(b => b.classList.contains('sel') === (b.textContent === '🚦')); ok ? pass() : fail(); });
}},
{ t: 'Aritmetica scritta', p: 'Risolvi l\'operazione e rispondi in cifre.', r(s) {
  const op = pick(['più', 'meno', 'per']); let a = 2 + rnd(11), b = 2 + rnd(8), res;
  if (op === 'meno' && b > a) [a, b] = [b, a];
  if (op === 'per') { a = 2 + rnd(8); b = 2 + rnd(8); }
  res = op === 'più' ? a + b : op === 'meno' ? a - b : a * b;
  s.append(el('div', 'big', `${NUMW[a]} ${op} ${NUMW[b]}`));
  answer(s, 'Risultato', v => parseInt(v, 10) === res, 'num');
}},
{ t: 'Il pezzo mancante', p: 'Trascina il cursore finché il blocco non riempie il buco. Precisione richiesta.', r(s) {
  const gap = 25 + rnd(66);
  const z = el('div', 'puzzle'), g = el('div', 'gap'), pc = el('div', 'piece');
  const pos = (e, v) => e.style.left = `calc((100% - 48px) * ${v / 100})`;
  pos(g, gap); pos(pc, 0); z.append(g, pc); s.append(z);
  const r = el('input'); r.type = 'range'; r.min = 0; r.max = 100; r.value = 0; r.id = 'slide' + idx; r.setAttribute('aria-label', 'Posizione del blocco');
  r.oninput = () => pos(pc, r.value); s.append(r);
  verifyBtn(s, () => Math.abs(r.value - gap) <= 2 ? pass() : fail('Fuori posto. Nuovo puzzle.'));
}},
{ t: 'Codice deformato', p: 'Scrivi i caratteri. Maiuscole e minuscole contano.', r(s) {
  textCaptcha(s, gen(6, 'ABDEFGHJKMNPQRTUYabdefghjkmnpqrty2345678'), true, true);
}},
{ t: 'In ordine, di corsa', p: 'Clicca i numeri dal più piccolo al più grande. Hai 7 secondi.', r(s) {
  const n = 7, cells = shuffle([...Array(12).keys()]).slice(0, n);
  const a = el('div', 'arena'); let next = 1;
  cells.forEach((c, i) => {
    const d = el('button', 'dot', i + 1), col = c % 4, row = Math.floor(c / 4);
    d.style.left = `calc(${col * 25}% + ${4 + rnd(30)}px)`; d.style.top = `calc(${row * 33.3}% + ${6 + rnd(24)}px)`;
    d.onclick = () => { if (d.classList.contains('hit')) return;
      if (+d.textContent !== next) return fail('Ordine sbagliato. Nuova disposizione.');
      d.classList.add('hit'); if (++next > n) pass(); };
    a.append(d);
  });
  s.append(a);
  return countdown(s, 7, () => fail('Tempo scaduto.'));
}},
{ t: 'Raddrizza la giraffa', p: 'Ruota l\'immagine finché la giraffa non è dritta.', r(s) {
  let ang = (1 + rnd(7)) * 45;
  const w = el('div', 'rot'), sp = el('span', null, '🦒'); w.append(sp); s.append(w);
  const set = () => sp.style.transform = `rotate(${ang}deg)`; set();
  const row = el('div', 'row'); row.style.justifyContent = 'center';
  const l = el('button', 'btn ghost', '↺ Ruota a sinistra'), rr = el('button', 'btn ghost', 'Ruota a destra ↻');
  l.onclick = () => { ang -= 45; set(); }; rr.onclick = () => { ang += 45; set(); };
  const ok = el('button', 'btn', 'Conferma'); ok.onclick = () => ((ang % 360) + 360) % 360 === 0 ? pass() : fail('Ancora storta.');
  row.append(l, rr, ok); s.append(row);
}},
{ t: 'Conta le forme', p: 'Quanti triangoli ROSSI ci sono? L\'arancione non vale.', r(s) {
  const W = 320, H = 200, cv = makeCanvas(W, H), ctx = cv.getContext('2d');
  ctx.fillStyle = css('--tile'); ctx.fillRect(0, 0, W, H);
  const red = '#d4261e', palette = [red, '#ee7a16', '#2a5bd7', '#1c9a48', '#b0172a'];
  const cells = shuffle([...Array(40).keys()]).slice(0, 20);
  const shapes = cells.map((c, i) => i < 2 + rnd(3) ? ['tri', red] : [pick(['tri', 'tri', 'circ', 'sq']), pick(palette)]);
  let count = 0;
  cells.forEach((c, i) => {
    const [sh, col] = shapes[i]; if (sh === 'tri' && col === red) count++;
    const x = (c % 8) * 40 + 20 + (Math.random() - .5) * 10, y = Math.floor(c / 8) * 40 + 20 + (Math.random() - .5) * 10, r = 11 + rnd(5);
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.random() * Math.PI * 2); ctx.fillStyle = col; ctx.beginPath();
    if (sh === 'tri') { ctx.moveTo(0, -r); ctx.lineTo(r * .87, r * .5); ctx.lineTo(-r * .87, r * .5); ctx.closePath(); }
    else if (sh === 'circ') ctx.arc(0, 0, r * .85, 0, Math.PI * 2);
    else ctx.rect(-r * .75, -r * .75, r * 1.5, r * 1.5);
    ctx.fill(); ctx.restore();
  });
  s.append(cv);
  s.append(el('p', 'hint', 'Il bordeaux scuro però è rosso? No: conta solo il rosso acceso.'));
  answer(s, 'Numero', v => parseInt(v, 10) === count, 'num');
}},
{ t: 'Il colore, non la parola', p: 'Clicca il colore dell\'INCHIOSTRO, non quello scritto. 5 di fila in 10 secondi.', r(s) {
  let round = 0;
  const w = el('div', 'stroop'), box = el('div', 'colors'), cnt = el('p', 'hint');
  s.append(w, box, cnt);
  const next = () => {
    if (round === 5) return pass();
    const word = pick(COLORS); let ink; do ink = pick(COLORS); while (ink === word);
    w.textContent = word[0].toUpperCase(); w.style.color = ink[1];
    cnt.textContent = `Parola ${round + 1} di 5`;
    box.innerHTML = '';
    shuffle([...COLORS]).forEach(c => { const b = el('button', null, c[0]);
      b.onclick = () => c === ink ? (round++, next()) : fail('Hai letto la parola. Si riparte.'); box.append(b); });
  };
  next();
  return countdown(s, 10, () => fail('Tempo scaduto.'));
}},
{ t: 'Memoria', p: 'Guarda la sequenza di 6 caselle, poi ripetila.', r(s) {
  const seq = Array.from({ length: 6 }, () => rnd(9)), g = el('div', 'grid'), st = el('p', 'hint', 'Osserva…');
  const tiles = Array.from({ length: 9 }, () => { const b = el('button', 'tile'); b.disabled = true; b.setAttribute('aria-label', 'casella'); g.append(b); return b; });
  s.append(st, g);
  const timers = []; let pos = 0;
  seq.forEach((k, i) => {
    timers.push(setTimeout(() => tiles[k].classList.add('lit'), 700 + i * 650));
    timers.push(setTimeout(() => tiles[k].classList.remove('lit'), 700 + i * 650 + 420));
  });
  timers.push(setTimeout(() => { st.textContent = 'Tocca a te: ripeti la sequenza.'; tiles.forEach(t => t.disabled = false); }, 700 + 6 * 650));
  tiles.forEach((t, k) => t.onclick = () => {
    if (k !== seq[pos]) return fail('Sequenza sbagliata. Nuova sequenza.');
    t.classList.add('lit'); setTimeout(() => t.classList.remove('lit'), 180);
    if (++pos === seq.length) setTimeout(pass, 250);
  });
  return () => timers.forEach(clearTimeout);
}},
{ t: 'Codice cifrato', p: 'Scrivi ogni lettera spostata di DUE posizioni avanti (A→C, Y→A, Z→B).', r(s) {
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  s.append(el('p', 'alpha', A.split('').join(' ')));
  textCaptcha(s, gen(5, 'ABCDEFGHKLMNPRSTUVWXYZ'), false, false, c => [...c].map(ch => A[(A.indexOf(ch) + 2) % 26]).join(''));
}},
{ t: 'Riflessi', p: 'Premi «Ferma» quando la barra è nella zona verde. Tre centri di fila: la zona si restringe e la barra accelera.', r(s) {
  const tr = el('div', 'track'), zone = el('div', 'zone'), mark = el('div', 'mark'), hits = el('div', 'hits');
  tr.append(zone, mark); s.append(tr, hits);
  hits.innerHTML = '<i></i><i></i><i></i>';
  const widths = [16, 10, 6], speeds = [55, 80, 110];
  let h = 0, p = 0, dir = 1, z = 0, raf, last = performance.now();
  const setZone = () => { z = 10 + Math.random() * (80 - widths[h]); zone.style.left = z + '%'; zone.style.width = widths[h] + '%';
    [...hits.children].forEach((d, i) => d.classList.toggle('on', i < h)); };
  setZone();
  const loop = now => { const dt = (now - last) / 1000; last = now; p += dir * speeds[h] * dt;
    if (p > 100) { p = 100; dir = -1; } if (p < 0) { p = 0; dir = 1; } mark.style.left = p + '%'; raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
  const b = el('button', 'btn', 'Ferma!'); b.style.alignSelf = 'center'; b.style.padding = '14px 40px';
  b.onclick = () => {
    if (p >= z && p <= z + widths[h]) { h++; if (h === 3) { cancelAnimationFrame(raf); hits.lastChild.classList.add('on'); return setTimeout(pass, 250); } setZone(); }
    else { h = 0; setZone(); softError('Mancato. Si riparte da zero.'); }
  };
  s.append(b);
  return () => cancelAnimationFrame(raf);
}},
{ t: 'Numeri primi', p: 'Seleziona tutti i numeri primi. Occhio alle trappole.', r(s) {
  const primes = shuffle([2, 23, 61, 89, 97, 73, 41, 59]).slice(0, 5);
  const traps = shuffle([1, 51, 57, 91, 87, 49, 39, 77, 119, 221, 133, 27, 69]).slice(0, 7);
  const set = new Set(primes), g = el('div', 'grid g4');
  shuffle([...primes, ...traps]).forEach(n => { const b = el('button', 'tile num', n); b.setAttribute('aria-pressed', 'false');
    b.onclick = () => { b.classList.toggle('sel'); b.setAttribute('aria-pressed', b.classList.contains('sel')); }; g.append(b); });
  s.append(g);
  verifyBtn(s, () => [...g.children].every(b => b.classList.contains('sel') === set.has(+b.textContent)) ? pass() : fail('Qualcosa non torna. Nuova griglia.'));
}},
{ t: 'Il boss finale', p: 'Spunta la casella. Stavolta non collabora.', r(s) {
  const a = el('div', 'arena'), b = el('button', 'flee', '<span class="box"></span><span>Non sono un robot</span>');
  a.append(b); s.append(a);
  const lines = ['Non sono un robot', 'Eh, no', 'Troppo lento', 'Quasi!', 'Ci provi ancora?', 'Sono stanca…'];
  let esc = 0, tired = false, busy = false;
  const place = (x, y) => { b.style.left = x + 'px'; b.style.top = y + 'px'; };
  requestAnimationFrame(() => place((a.clientWidth - b.offsetWidth) / 2, (a.clientHeight - b.offsetHeight) / 2));
  const move = () => {
    const mx = a.clientWidth - b.offsetWidth, my = a.clientHeight - b.offsetHeight, cx = b.offsetLeft, cy = b.offsetTop;
    let x, y, tries = 0; do { x = Math.random() * mx; y = Math.random() * my; } while (Math.hypot(x - cx, y - cy) < 110 && ++tries < 20);
    place(x, y); esc++;
    b.lastChild.textContent = esc >= 12 ? lines[5] : lines[Math.min(4, Math.floor(esc / 3) + 1)];
    if (esc >= 12) { tired = true; b.classList.add('tired'); }
  };
  a.addEventListener('pointermove', e => {
    if (tired || busy || e.pointerType !== 'mouse') return;
    const r = b.getBoundingClientRect(), d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
    if (d < 75) { busy = true; move(); setTimeout(() => busy = false, 200); }
  });
  b.onclick = () => {
    if (!tired) { esc += 1; return move(); }
    b.onclick = null; b.lastChild.textContent = 'Va bene, hai vinto'; b.firstChild.style.background = 'var(--ok)'; b.firstChild.style.borderColor = 'var(--ok)';
    setTimeout(pass, 600);
  };
}},
];

// ---------- motore ----------
const LEVELS = ['Banale', 'Facile', 'Media', 'Difficile', 'Infernale'];
const prog = $('#prog'); C.forEach(() => prog.append(el('i')));
const pips = $('#pips'); for (let i = 0; i < 5; i++) { const p = el('i'); p.style.height = (6 + i * 3) + 'px'; pips.append(p); }

function show(i) {
  if (cleanup) { cleanup(); cleanup = null; }
  stage.innerHTML = '';
  const c = C[i], lvl = Math.ceil((i + 1) / 3);
  $('#n').textContent = i + 1; $('#title').textContent = c.t; $('#prompt').textContent = c.p;
  [...pips.children].forEach((p, k) => p.classList.toggle('on', k < lvl));
  $('#difflabel').textContent = LEVELS[lvl - 1];
  [...prog.children].forEach((p, k) => p.className = k < i ? 'done' : k === i ? 'cur' : '');
  cleanup = c.r(stage) || null;
}
function fmt(ms) { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
setInterval(() => { if (!finished) $('#time').textContent = fmt(Date.now() - t0); }, 500);

function finish() {
  finished = true; if (cleanup) { cleanup(); cleanup = null; }
  const time = fmt(Date.now() - t0);
  [...prog.children].forEach(p => p.className = 'done');
  $('#title').textContent = 'Umanità certificata'; $('#prompt').textContent = 'Hai superato tutte e 15 le verifiche.';
  $('#n').textContent = 15; $('#difflabel').textContent = 'Fine';
  const v = errors === 0 ? 'Zero errori. Sospettosamente perfetto: sei sicuro di non essere un robot?'
    : errors <= 3 ? 'Umano al cento per cento. Qualche esitazione, come si conviene.'
    : errors <= 8 ? 'Umano, probabilmente. Il sistema ti tiene d\'occhio.'
    : 'Molto, molto umano. Nessun robot sbaglierebbe così tanto.';
  stage.innerHTML = `<div class="cert"><div class="seal">UMANO<br>VERIFICATO</div>
    <dl><div><dt>Tempo</dt><dd>${time}</dd></div><div><dt>Errori</dt><dd>${errors}</dd></div></dl>
    <p class="verdict">${v}</p></div>`;
  const b = el('button', 'btn', 'Ricomincia da capo'); b.style.alignSelf = 'center';
  b.onclick = () => { idx = 0; errors = 0; $('#errs').textContent = 0; t0 = Date.now(); finished = false; show(0); };
  stage.append(b);
}

const start = () => show(0);
(document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(start);
</script>
