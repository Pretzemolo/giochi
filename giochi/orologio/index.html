    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .font-mono-num {
            font-family: 'JetBrains Mono', monospace;
        }
        .white-border-text {
            -webkit-text-stroke: 1.5px #ffffff;
            paint-order: stroke fill;
            text-shadow: 
                2px 2px 0 #ffffff,
               -2px 2px 0 #ffffff,
                2px -2px 0 #ffffff,
               -2px -2px 0 #ffffff,
                0px 2px 0 #ffffff,
                0px -2px 0 #ffffff,
                2px 0px 0 #ffffff,
               -2px 0px 0 #ffffff;
        }
        .white-border-text-sm {
            -webkit-text-stroke: 1px #ffffff;
            paint-order: stroke fill;
            text-shadow: 
                1px 1px 0 #ffffff,
               -1px 1px 0 #ffffff,
                1px -1px 0 #ffffff,
               -1px -1px 0 #ffffff;
        }
    </style>
</head>
<body class="bg-transparent text-slate-900 min-h-screen flex items-center justify-center p-4 select-none overflow-hidden">

    <!-- Main Minimal Container -->
    <main class="text-center space-y-2">
        
        <!-- Sezione Orologio Principale -->
        <div class="font-mono-num text-2xl sm:text-3xl md:text-4xl font-bold tracking-tight text-slate-900 flex items-center justify-center gap-1 white-border-text-sm">
            <span id="hours">00</span>
            <span class="animate-pulse text-slate-700">:</span>
            <span id="minutes">00</span>
            <span class="animate-pulse text-slate-700">:</span>
            <span id="seconds" class="text-slate-700">00</span>
        </div>

        <!-- Sezione Data Principale -->
        <div class="space-y-0.5">
            <div id="dayOfWeek" class="text-slate-800 font-semibold uppercase text-xs sm:text-sm tracking-widest white-border-text-sm">
                --
            </div>
            <div id="fullDate" class="text-sm sm:text-base md:text-lg font-bold text-slate-900 tracking-wide white-border-text-sm">
                --
            </div>
        </div>

    </main>

    <script>
        let timeOffset = 0; // Differenza di tempo in ms tra il server atomico e il clock locale

        /**
         * Sincronizza l'orologio via Internet con algoritmo NTP multi-campione.
         * Seleziona la risposta con la minore latenza di rete (RTT) per eliminare qualsiasi ritardo.
         */
        async function syncTimeWithInternet() {
            const endpoints = [
                async () => {
                    const t0 = Date.now();
                    const res = await fetch('https://worldtimeapi.org/api/timezone/Europe/Rome', { cache: 'no-store' });
                    const t1 = Date.now();
                    if (!res.ok) throw new Error('HTTP Error');
                    const data = await res.json();
                    const serverMs = new Date(data.datetime).getTime();
                    const rtt = t1 - t0;
                    return { offset: serverMs + Math.round(rtt / 2) - t1, rtt };
                },
                async () => {
                    const t0 = Date.now();
                    const res = await fetch('https://timeapi.io/api/v1/time/current/zone?timeZone=Europe/Rome', { cache: 'no-store' });
                    const t1 = Date.now();
                    if (!res.ok) throw new Error('HTTP Error');
                    const data = await res.json();
                    const serverMs = new Date(data.dateTime || data.currentLocalTime).getTime();
                    const rtt = t1 - t0;
                    return { offset: serverMs + Math.round(rtt / 2) - t1, rtt };
                }
            ];

            let bestResult = null;

            for (const fetcher of endpoints) {
                try {
                    const result = await fetcher();
                    if (!bestResult || result.rtt < bestResult.rtt) {
                        bestResult = result;
                    }
                } catch (e) {
                    // Prova il server successivo se uno fallisce
                }
            }

            if (bestResult) {
                timeOffset = bestResult.offset;
            }
        }

        /**
         * Aggiorna l'ora esatta in Italia (Europe/Rome).
         */
        function updateClock() {
            // Applica il delta preciso della sincronizzazione Internet
            const now = new Date(Date.now() + timeOffset);

            // Formattatore per l'ora esatta in Italia (gestione automatica Ora Legale/Solare)
            const timeFormatter = new Intl.DateTimeFormat('it-IT', {
                timeZone: 'Europe/Rome',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            // Estrazione di ore, minuti e secondi
            const parts = timeFormatter.formatToParts(now);
            let h = '00', m = '00', s = '00';
            
            for (const part of parts) {
                if (part.type === 'hour') h = part.value;
                if (part.type === 'minute') m = part.value;
                if (part.type === 'second') s = part.value;
            }

            document.getElementById('hours').textContent = h;
            document.getElementById('minutes').textContent = m;
            document.getElementById('seconds').textContent = s;

            // Formattazione del giorno della settimana
            const dayOfWeekFormatter = new Intl.DateTimeFormat('it-IT', {
                timeZone: 'Europe/Rome',
                weekday: 'long'
            });

            // Formattazione della data estesa
            const fullDateFormatter = new Intl.DateTimeFormat('it-IT', {
                timeZone: 'Europe/Rome',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });

            const dayText = dayOfWeekFormatter.format(now);
            document.getElementById('dayOfWeek').textContent = dayText.charAt(0).toUpperCase() + dayText.slice(1);
            document.getElementById('fullDate').textContent = fullDateFormatter.format(now);
        }

        // Inizializzazione ed esecuzione ad alta frequenza (100ms) per cambi di secondo istantanei senza lag
        window.onload = function() {
            updateClock();
            setInterval(updateClock, 100);

            // Sincronizzazione iniziale e ricampionamento periodico (ogni 3 minuti e al focus della finestra)
            syncTimeWithInternet();
            setInterval(syncTimeWithInternet, 180000);
            window.addEventListener('focus', syncTimeWithInternet);
        };
    </script>
</body>
