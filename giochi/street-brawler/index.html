<script>
/* Giaco&Dario: ritmo fisso a 60 aggiornamenti al secondo.
   Il gioco muove tutto "per frame": senza questo blocco su uno schermo a 120/144 Hz
   andrebbe 2-2,5 volte più veloce. */
(function(){
  var raf=window.requestAnimationFrame.bind(window), caf=window.cancelAnimationFrame.bind(window);
  var STEP=1000/60, TOL=4, next=0, lastT=-1, ok=true, seq=0, live=new Map();
  function allow(t){
    if(t===lastT) return ok; lastT=t;
    if(!next || t-next>250){ next=t; }
    if(t>=next-TOL){ next+=STEP; if(next<t-STEP) next=t; ok=true; } else ok=false;
    return ok;
  }
  window.requestAnimationFrame=function(cb){
    var id=++seq;
    function run(t){ if(!live.has(id)) return; if(allow(t)){ live.delete(id); cb(t); } else live.set(id, raf(run)); }
    live.set(id, raf(run)); return id;
  };
  window.cancelAnimationFrame=function(id){ if(live.has(id)){ caf(live.get(id)); live.delete(id); } };
})();
</script>

<body class="flex flex-col items-center justify-between min-h-screen m-0 p-2 overflow-hidden">

    <!-- Schermata Menu Principale con Tutorial Interattivo -->
    <div id="main-menu" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/95 backdrop-blur-md p-4 text-center overflow-y-auto">
        <h1 class="text-3xl md:text-5xl font-black text-amber-400 tracking-wider mb-1 drop-shadow-[0_0_20px_rgba(245,158,11,0.6)]">STREET BRAWLER</h1>
        <p class="text-zinc-400 mb-4 text-xs md:text-sm">RYU vs IA COMBAT</p>
        
        <!-- Box Tutorial Interattivo -->
        <div class="w-full max-w-lg bg-zinc-900 border-2 border-amber-500/60 rounded-xl p-4 mb-6 shadow-xl text-left">
            <h2 class="text-amber-400 font-bold text-base mb-2 text-center uppercase tracking-wider">📖 Tutorial Interattivo</h2>
            <div id="tutorial-step" class="text-xs md:text-sm text-zinc-300 space-y-2 min-h-[70px] flex items-center justify-center text-center">
                Caricamento tutorial...
            </div>
            <div class="flex justify-between items-center mt-4 pt-2 border-t border-zinc-800">
                <button onclick="prevTutorialStep()" class="px-3 py-1 bg-zinc-800 hover:bg-zinc-700 text-amber-400 text-xs font-bold rounded">Indietro</button>
                <span id="tutorial-indicator" class="text-xs text-zinc-500 font-mono">1 / 4</span>
                <button onclick="nextTutorialStep()" class="px-3 py-1 bg-amber-500 hover:bg-amber-400 text-black text-xs font-bold rounded">Avanti</button>
            </div>
        </div>

        <button onclick="startMainMenuGame()" class="px-8 py-3.5 bg-amber-500 hover:bg-amber-400 text-black font-black text-lg rounded-xl shadow-[0_0_15px_rgba(245,158,11,0.5)] transition-all transform hover:scale-105 cursor-pointer">
            GIOCA ORA
        </button>
    </div>

    <!-- Header / UI del Gioco -->
    <div class="w-full max-w-[800px] flex flex-col mb-1 px-4 bg-zinc-900 border-2 border-amber-500 rounded-xl py-2 shadow-lg gap-1">
        <div class="flex justify-between items-center">
            <!-- Giocatore 1 -->
            <div class="flex flex-col w-5/12">
                <div class="flex justify-between font-extrabold text-amber-400 text-xs md:text-sm mb-1 tracking-wider">
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 bg-red-600 inline-block rounded-full"></span> P1: RYU</span>
                    <span id="p1-hp-text">100%</span>
                </div>
                <div class="w-full bg-zinc-950 h-5 md:h-6 border-2 border-amber-500/50 rounded-md overflow-hidden p-0.5">
                    <div id="p1-hp" class="bg-gradient-to-r from-red-600 to-amber-500 h-full rounded transition-all duration-100" style="width: 100%;"></div>
                </div>
            </div>

            <!-- Timer e Pulsante Pausa sotto -->
            <div class="flex flex-col items-center">
                <div class="text-2xl md:text-3xl font-black text-amber-400 bg-black px-3 py-1 border-2 border-red-600 rounded-lg shadow-inner">
                    <span id="timer">99</span>
                </div>
                <button onclick="togglePause()" id="pause-btn" class="mt-1 px-3 py-0.5 bg-zinc-800 hover:bg-zinc-700 active:bg-amber-500 active:text-black border border-amber-500/50 rounded text-[10px] md:text-xs font-bold text-amber-400 cursor-pointer shadow">
                    PAUSA
                </button>
            </div>

            <!-- Giocatore 2 (IA) -->
            <div class="flex flex-col w-5/12 items-end">
                <div class="flex justify-between font-extrabold text-amber-400 text-xs md:text-sm mb-1 w-full tracking-wider">
                    <span id="p2-hp-text">100%</span>
                    <span class="flex items-center gap-1">IA: KEN <span class="w-2.5 h-2.5 bg-blue-600 inline-block rounded-full"></span></span>
                </div>
                <div class="w-full bg-zinc-950 h-5 md:h-6 border-2 border-amber-500/50 rounded-md overflow-hidden p-0.5 flex justify-end">
                    <div id="p2-hp" class="bg-gradient-to-l from-blue-600 to-amber-500 h-full rounded transition-all duration-100" style="width: 100%;"></div>
                </div>
            </div>
        </div>

        <!-- Barre di Carica Hadoken -->
        <div class="flex justify-between items-center text-[10px] md:text-xs font-bold text-sky-400">
            <div class="w-5/12 flex flex-col">
                <span>CARICA HADOKEN: <span id="p1-charge-text">0%</span></span>
                <div class="w-full bg-zinc-950 h-2.5 border border-sky-500/50 rounded mt-0.5 overflow-hidden">
                    <div id="p1-charge" class="bg-sky-400 h-full transition-all duration-100" style="width: 0%;"></div>
                </div>
            </div>
            <div class="w-5/12 flex flex-col items-end">
                <span>CARICA IA: <span id="p2-charge-text">0%</span></span>
                <div class="w-full bg-zinc-950 h-2.5 border border-sky-500/50 rounded mt-0.5 overflow-hidden flex justify-end">
                    <div id="p2-charge" class="bg-sky-400 h-full transition-all duration-100" style="width: 0%;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Canvas di Gioco -->
    <div class="relative border-4 border-amber-500 shadow-[0_0_25px_rgba(245,158,11,0.3)] rounded-xl overflow-hidden bg-black w-full max-w-[800px] aspect-[2/1]">
        <canvas id="gameCanvas" width="800" height="400" class="w-full h-full"></canvas>
        
        <!-- Schermata di fine round / Messaggi -->
        <div id="announcement" class="absolute inset-0 flex flex-col items-center justify-center text-4xl md:text-6xl font-black text-amber-400 drop-shadow-[0_5px_10px_rgba(0,0,0,0.9)] pointer-events-none hidden bg-black/40 backdrop-blur-xs">
            <span id="announcement-text">ROUND 1</span>
            <button id="restart-btn" onclick="resetGame()" class="mt-4 px-6 py-3 bg-amber-500 hover:bg-amber-400 text-black font-bold text-base md:text-lg rounded-xl shadow-lg pointer-events-auto transition-all transform hover:scale-105 cursor-pointer hidden">
                RIGIOCA
            </button>
        </div>
    </div>

    <!-- Controlli Virtuali Touch per Mobile -->
    <div class="w-full max-w-[800px] flex justify-between items-center bg-zinc-900 px-4 py-2 rounded-xl border border-zinc-700 shadow-lg mt-1">
        <div class="flex gap-2">
            <button id="btn-left" class="w-12 h-12 bg-zinc-800 active:bg-amber-500 active:text-black border border-zinc-600 rounded-lg text-lg font-bold flex items-center justify-center">←</button>
            <button id="btn-right" class="w-12 h-12 bg-zinc-800 active:bg-amber-500 active:text-black border border-zinc-600 rounded-lg text-lg font-bold flex items-center justify-center">→</button>
            <button id="btn-jump" class="w-12 h-12 bg-zinc-800 active:bg-amber-500 active:text-black border border-zinc-600 rounded-lg text-lg font-bold flex items-center justify-center">↑</button>
            <button id="btn-block" class="w-12 h-12 bg-zinc-800 active:bg-amber-500 active:text-black border border-zinc-600 rounded-lg text-xs font-bold flex items-center justify-center">PARA</button>
        </div>
        <div class="flex gap-2">
            <button id="btn-punch" class="px-4 h-12 bg-red-600 active:bg-red-500 border border-red-400 rounded-lg text-xs font-bold flex items-center justify-center">PUGNO</button>
            <button id="btn-hadoken" class="px-4 h-12 bg-sky-500 active:bg-sky-400 text-black border border-sky-300 rounded-lg text-xs font-bold flex items-center justify-center">HADOKEN</button>
        </div>
    </div>

    <script>
        const tutorialSteps = [
            "Benvenuto in Street Brawler! Usa i tasti <b>A / D</b> o le <b>Frecce Sinistra / Destra</b> per muoverti avanti e indietro.",
            "Premi il tasto <b>W</b> o la <b>Freccia Su</b> per saltare ed evitare gli attacchi o i colpi energetici della IA.",
            "Premi e tieni premuto il tasto <b>S</b> o la <b>Freccia Giù</b> per metterti in posizione di guardia e parare i colpi.",
            "Premi <b>F</b> (PUGNO) per colpire l'avversario. La barra Hadoken si riempie del 25% <b>solo se il pugno va a segno</b>! Quando arriva al 100%, premi <b>H</b> (HADOKEN) per scatenare un colpo devastante!"
        ];
        let currentTutorialIndex = 0;

        function updateTutorialDisplay() {
            document.getElementById('tutorial-step').innerHTML = tutorialSteps[currentTutorialIndex];
            document.getElementById('tutorial-indicator').innerText = (currentTutorialIndex + 1) + ' / ' + tutorialSteps.length;
        }

        function nextTutorialStep() {
            if (currentTutorialIndex < tutorialSteps.length - 1) {
                currentTutorialIndex++;
                updateTutorialDisplay();
            }
        }

        function prevTutorialStep() {
            if (currentTutorialIndex > 0) {
                currentTutorialIndex--;
                updateTutorialDisplay();
            }
        }

        updateTutorialDisplay();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'MENU';
        let timer = 99;
        let timerInterval;

        const keys = {};
        window.addEventListener('keydown', e => {
            if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
            }
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'ArrowLeft') keys['a'] = true;
            if (e.key === 'ArrowRight') keys['d'] = true;
            if (e.key === 'ArrowUp') keys['w'] = true;
            if (e.key === 'ArrowDown') keys['s'] = true;
        });

        window.addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = false;
            if (e.key === 'ArrowLeft') keys['a'] = false;
            if (e.key === 'ArrowRight') keys['d'] = false;
            if (e.key === 'ArrowUp') keys['w'] = false;
            if (e.key === 'ArrowDown') keys['s'] = false;
        });

        function bindTouchButton(id, keyName) {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); keys[keyName] = false; });
        }

        bindTouchButton('btn-left', 'a');
        bindTouchButton('btn-right', 'd');
        bindTouchButton('btn-jump', 'w');
        bindTouchButton('btn-block', 's');
        bindTouchButton('btn-punch', 'f');
        bindTouchButton('btn-hadoken', 'h');

        function togglePause() {
            if (gameState === 'FIGHT') {
                gameState = 'PAUSE';
                clearInterval(timerInterval);
                const ann = document.getElementById('announcement');
                const annText = document.getElementById('announcement-text');
                annText.innerText = "IN PAUSA";
                ann.classList.remove('hidden');
            } else if (gameState === 'PAUSE') {
                gameState = 'FIGHT';
                const ann = document.getElementById('announcement');
                ann.classList.add('hidden');
                timerInterval = setInterval(() => {
                    if (timer > 0) timer--;
                }, 1000);
            }
        }

        class Fighter {
            constructor(x, y, color, accentColor, facingRight, name, isAI = false) {
                this.x = x;
                this.y = y;
                this.width = 60;
                this.height = 130;
                this.color = color;
                this.accentColor = accentColor;
                this.facingRight = facingRight;
                this.name = name;
                this.isAI = isAI;
                
                this.vx = 0;
                this.vy = 0;
                this.maxHp = 300;
                this.hp = this.maxHp;
                this.isJumping = false;
                this.isAttacking = false;
                this.attackType = null;
                this.isBlocking = false;
                this.hitStun = 0;

                this.cooldown = 0;
                this.hadokenCharge = 0;
                
                this.projectiles = [];
                this.aiTimer = 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                if (!this.facingRight) ctx.scale(-1, 1);

                const mainColor = this.hitStun > 0 && Math.floor(this.hitStun / 3) % 2 === 0 ? '#ffffff' : this.color;
                
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(0, this.height / 2 - 5, 25, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = this.accentColor;
                ctx.fillRect(-18, 25, 14, 40);
                ctx.fillRect(4, 25, 14, 40);
                ctx.fillStyle = '#111111';
                ctx.fillRect(-20, 55, 16, 10);
                ctx.fillRect(4, 55, 16, 10);

                ctx.fillStyle = mainColor;
                if (this.isBlocking) {
                    ctx.fillRect(-22, -25, 44, 55);
                    ctx.fillStyle = '#e2e8f0';
                    ctx.fillRect(-12, -15, 24, 35);
                } else {
                    ctx.fillRect(-22, -30, 44, 60);
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(-22, 15, 44, 8);
                }

                ctx.fillStyle = mainColor;
                if (this.isAttacking && this.attackType === 'punch') {
                    ctx.fillRect(10, -25, 42, 14);
                    ctx.fillStyle = '#f59e0b';
                    ctx.fillRect(42, -28, 14, 18);
                } else {
                    ctx.fillRect(-28, -20, 12, 40);
                    ctx.fillRect(16, -20, 12, 40);
                }

                ctx.fillStyle = '#fbcfe8';
                ctx.fillRect(-14, -65, 28, 30);
                ctx.fillStyle = this.name === 'RYU' ? '#27272a' : '#b45309';
                ctx.fillRect(-14, -68, 28, 12);
                ctx.fillStyle = this.name === 'RYU' ? '#dc2626' : '#2563eb';
                ctx.fillRect(-16, -58, 32, 6);
                if (this.facingRight) {
                    ctx.fillRect(16, -58, 18, 4);
                } else {
                    ctx.fillRect(-34, -58, 18, 4);
                }

                ctx.restore();

                this.projectiles.forEach(p => p.draw());
            }

            update(opponent) {
                if (this.hitStun > 0) this.hitStun--;
                if (this.cooldown > 0) this.cooldown--;

                this.vy += 0.65;
                this.y += this.vy;

                if (this.y + this.height >= 330) {
                    this.y = 330 - this.height;
                    this.vy = 0;
                    this.isJumping = false;
                }

                if (this.x < 10) this.x = 10;
                if (this.x + this.width > canvas.width - 10) this.x = canvas.width - 10 - this.width;

                if (gameState === 'FIGHT') {
                    this.facingRight = this.x < opponent.x;
                }

                if (this.isAI && gameState === 'FIGHT') {
                    this.aiTimer++;
                    const distance = Math.abs(this.x - opponent.x);

                    if (distance > 120) {
                        this.x += (this.x < opponent.x) ? 3.5 : -3.5;
                        this.isBlocking = false;
                        if (this.hadokenCharge >= 100 && this.cooldown === 0) {
                            this.shootHadoken();
                        }
                    } else if (distance <= 120) {
                        if (Math.random() < 0.04) {
                            this.isBlocking = true;
                        } else {
                            this.isBlocking = false;
                        }

                        if (this.aiTimer % 50 === 0 && this.cooldown === 0) {
                            if (this.hadokenCharge >= 100 && Math.random() < 0.4) {
                                this.shootHadoken();
                            } else {
                                this.attack('punch', opponent);
                            }
                        }
                    }
                }

                this.projectiles.forEach((p, index) => {
                    p.update();
                    if (
                        p.x < opponent.x + opponent.width &&
                        p.x + p.width > opponent.x &&
                        p.y < opponent.y + opponent.height &&
                        p.y + p.height > opponent.y
                    ) {
                        opponent.takeDamage(90, opponent.isBlocking ? 0.3 : 1);
                        this.projectiles.splice(index, 1);
                    }
                    if (p.x < 0 || p.x > canvas.width) {
                        this.projectiles.splice(index, 1);
                    }
                });
            }

            takeDamage(amount, multiplier = 1) {
                let finalDamage = Math.floor(amount * multiplier);
                this.hp = Math.max(0, this.hp - finalDamage);
                this.hitStun = multiplier < 1 ? 6 : 18;
            }

            attack(type, opponent) {
                if (this.cooldown > 0 || this.hitStun > 0) return;
                this.isAttacking = true;
                this.attackType = type;
                this.cooldown = 30;

                setTimeout(() => {
                    this.isAttacking = false;
                    this.attackType = null;
                }, 220);

                let hitBoxWidth = 50;
                let hitBoxX = this.facingRight ? this.x + this.width : this.x - hitBoxWidth;
                
                if (
                    hitBoxX < opponent.x + opponent.width &&
                    hitBoxX + hitBoxWidth > opponent.x &&
                    this.y < opponent.y + opponent.height &&
                    this.y + this.height > opponent.y
                ) {
                    let dmg = 15;
                    let mult = opponent.isBlocking ? 0.25 : 1;
                    opponent.takeDamage(dmg, mult);

                    if (this.hadokenCharge < 100) {
                        this.hadokenCharge = Math.min(100, this.hadokenCharge + 25);
                    }
                }
            }

            shootHadoken() {
                if (this.hadokenCharge < 100 || this.cooldown > 0 || this.hitStun > 0) return;
                this.isAttacking = true;
                this.cooldown = 30;
                this.hadokenCharge = 0;
                setTimeout(() => this.isAttacking = false, 350);

                const pX = this.facingRight ? this.x + this.width : this.x - 45;
                this.projectiles.push(new Hadoken(pX, this.y + 30, this.facingRight));
            }
        }

        class Hadoken {
            constructor(x, y, facingRight) {
                this.x = x;
                this.y = y;
                this.width = 46;
                this.height = 32;
                this.speed = facingRight ? 11 : -11;
            }
            update() {
                this.x += this.speed;
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#38bdf8';
                
                ctx.fillStyle = '#0284c7';
                ctx.beginPath();
                ctx.arc(this.x + 23, this.y + 16, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(this.x + 23, this.y + 16, 13, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x + 23, this.y + 16, 6, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        let p1 = new Fighter(150, 200, '#ffffff', '#dc2626', true, 'RYU', false);
        let p2 = new Fighter(590, 200, '#fef08a', '#2563eb', false, 'KEN', true);

        function handleInput() {
            if (gameState !== 'FIGHT') return;

            p1.isBlocking = keys['s'] && !p1.isJumping;
            if (!p1.isBlocking && p1.hitStun === 0) {
                if (keys['a']) { p1.x -= 6; }
                if (keys['d']) { p1.x += 6; }
                if (keys['w'] && !p1.isJumping) { p1.vy = -14.5; p1.isJumping = true; }
                if (keys['f']) { p1.attack('punch', p2); keys['f'] = false; }
                if (keys['h']) { p1.shootHadoken(); keys['h'] = false; }
            }
        }

        function updateUI() {
            let p1Percent = Math.max(0, Math.floor((p1.hp / p1.maxHp) * 100));
            let p2Percent = Math.max(0, Math.floor((p2.hp / p2.maxHp) * 100));

            document.getElementById('p1-hp').style.width = p1Percent + '%';
            document.getElementById('p1-hp-text').innerText = p1Percent + '%';
            document.getElementById('p2-hp').style.width = p2Percent + '%';
            document.getElementById('p2-hp-text').innerText = p2Percent + '%';

            document.getElementById('p1-charge').style.width = p1.hadokenCharge + '%';
            document.getElementById('p1-charge-text').innerText = p1.hadokenCharge + '%';
            document.getElementById('p2-charge').style.width = p2.hadokenCharge + '%';
            document.getElementById('p2-charge-text').innerText = p2.hadokenCharge + '%';

            document.getElementById('timer').innerText = timer;

            if (p1.hp <= 0 || p2.hp <= 0 || timer <= 0) {
                endGame();
            }
        }

        function endGame() {
            gameState = 'OVER';
            clearInterval(timerInterval);
            const ann = document.getElementById('announcement');
            const annText = document.getElementById('announcement-text');
            const restartBtn = document.getElementById('restart-btn');
            
            ann.classList.remove('hidden');
            restartBtn.classList.remove('hidden');

            if (p1.hp > p2.hp) annText.innerText = "VITTORIA!";
            else if (p2.hp > p1.hp) annText.innerText = "VITTORIA IA!";
            else annText.innerText = "PAREGGIO!";
        }

        function resetGame() {
            p1 = new Fighter(150, 200, '#ffffff', '#dc2626', true, 'RYU', false);
            p2 = new Fighter(590, 200, '#fef08a', '#2563eb', false, 'KEN', true);
            timer = 99;
            document.getElementById('announcement').classList.add('hidden');
            document.getElementById('restart-btn').classList.add('hidden');
            startGameSequence();
        }

        function startMainMenuGame() {
            document.getElementById('main-menu').classList.add('hidden');
            resetGame();
        }

        function drawBackground() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, 330);

            ctx.fillStyle = 'rgba(245, 158, 11, 0.15)';
            ctx.beginPath();
            ctx.arc(700, 100, 70, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(50, 120, 90, 210);
            ctx.fillRect(160, 80, 120, 250);
            ctx.fillRect(320, 150, 80, 180);
            ctx.fillRect(450, 100, 130, 230);
            ctx.fillRect(620, 140, 110, 190);

            ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
            ctx.fillRect(180, 110, 20, 30);
            ctx.fillRect(220, 110, 20, 30);
            ctx.fillRect(480, 130, 30, 20);
            ctx.fillRect(530, 130, 30, 20);

            ctx.fillStyle = '#18181b';
            ctx.fillRect(0, 330, canvas.width, 70);
            
            ctx.strokeStyle = '#f50b0b';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 330);
            ctx.lineTo(canvas.width, 330);
            ctx.stroke();

            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 336);
            ctx.lineTo(canvas.width, 336);
            ctx.stroke();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            if (gameState === 'FIGHT') {
                handleInput();
                p1.update(p2);
                p2.update(p1);
            }

            p1.draw();
            p2.draw();

            updateUI();
            requestAnimationFrame(gameLoop);
        }

        function startGameSequence() {
            const ann = document.getElementById('announcement');
            const annText = document.getElementById('announcement-text');
            ann.classList.remove('hidden');
            annText.innerText = "PRONTI?";

            setTimeout(() => {
                annText.innerText = "COMBATTI!";
                setTimeout(() => {
                    ann.classList.add('hidden');
                    gameState = 'FIGHT';
                    timerInterval = setInterval(() => {
                        if (timer > 0) timer--;
                    }, 1000);
                }, 1000);
            }, 1000);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
